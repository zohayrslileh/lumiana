<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A persistent counter powered by a Lumiana shared Worker" />
    <link rel="icon" href="data:," />
    <title>Lumiana Shared Counter</title>
  </head>
  <body>
    <main id="app">
      <section class="counter" aria-labelledby="title">
        <p class="eyebrow">Lumiana shared Worker</p>
        <h1 id="title">A counter that outlives the page</h1>
        <p class="description">
          Change the value, reload this page, or open another tab. Every browser session attaches to
          the same Worker instance.
        </p>

        <output class="value" aria-live="polite" aria-label="Counter value">&mdash;</output>

        <div class="controls" aria-label="Counter controls">
          <button type="button" data-action="decrement" aria-label="Decrease counter">
            &minus;
          </button>
          <button type="button" data-action="increment" aria-label="Increase counter">+</button>
        </div>

        <button class="reset" type="button" data-action="reset">Reset to zero</button>
        <p class="status" role="status">Connecting to Lumiana&hellip;</p>
      </section>
    </main>
    
  </body>
</html>
