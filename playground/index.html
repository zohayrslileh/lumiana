<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lumiana Playground</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header>
        <div class="logo-container">
          <div class="logo-badge">⚡ LUMIANA</div>
          <span class="tag">Native Node + Vite</span>
        </div>
        <h1>Lumiana Architecture Test</h1>
        <p class="subtitle">One session runtime for development and production</p>
      </header>

      <main>
        <section class="card">
          <h2>Server Status</h2>
          <p>Read the main server status through <code>lumiana.status()</code>.</p>
          <div class="actions">
            <button id="status-btn" class="primary-btn">
              <span>Refresh Status</span>
            </button>
          </div>

          <div class="result-box" id="result-box">
            <div class="status-indicator ready" id="status-indicator"></div>
            <pre id="output">Connecting…</pre>
          </div>
        </section>

        <section class="info-grid">
          <div class="info-card">
            <h3>Mode</h3>
            <span class="badge" id="mode-badge">Detecting...</span>
          </div>
          <div class="info-card">
            <h3>Server Uptime</h3>
            <span class="value" id="uptime-value">-</span>
          </div>
          <div class="info-card">
            <h3>Round-trip Latency</h3>
            <span class="value" id="latency-value">-</span>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
